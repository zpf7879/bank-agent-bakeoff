[project]
name = "card-agent-agentcore"
version = "0.1.0"
description = "Bake-off Side A: LangGraph card agent on Amazon Bedrock AgentCore"
requires-python = ">=3.11"
dependencies = [
  # The runtime launches the agent under OpenTelemetry instrumentation; without these the deploy fails.
  "aws-opentelemetry-distro~=0.18.0",
  "opentelemetry-instrumentation-langchain>=0.59.0",
  "bedrock-agentcore",
  "boto3>=1.40",
  "langgraph>=0.6",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "langgraph-checkpoint-aws>=1.2",
  "psycopg[binary]>=3.2",
]
