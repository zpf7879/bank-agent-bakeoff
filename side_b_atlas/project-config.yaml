# Side B project-level memory configuration (shared by all agents in the project).
# Secrets are NOT set here. Upload them as project secrets:
#   agentengine secret set VOYAGE_API_KEY
#   agentengine secret set LLM_API_KEY --sync
# After changing this file: agentengine memory configure && agentengine memory apply
memory:
  log_level: info

  voyage:
    model: "voyage-4-large"
    dimension: 1024

  short_term:
    embed_on_write: false

  # Same provider as the agent: Claude through the Anthropic API.
  extraction_llm:
    provider: anthropic
    model: claude-sonnet-5
    api_key_secret: LLM_API_KEY

  background_extraction:
    snapshot:
      max_messages: 20
      stale_minutes: 1

  # Valid types: semantic, episodic, taxonomic, preferences, procedural.
  # find_procedure needs procedural; define_bank_term needs taxonomic.
  extraction:
    enabled:
      - semantic
      - episodic
      - taxonomic
      - procedural
